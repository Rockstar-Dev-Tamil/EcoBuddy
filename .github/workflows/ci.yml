name: CI — Lint · Type-check · Test

# Triggers on every push to main and on all pull requests targeting main.
# This ensures every contribution is validated before merging.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js 20 (matches the LTS used in development)
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # 3. Install all dependencies with a clean install
      - name: Install dependencies
        run: npm ci

      # 4. TypeScript — strict type checking (no emit, just validation)
      - name: TypeScript type check
        run: npx tsc --noEmit

      # 5. ESLint — catches style and correctness issues
      - name: Lint
        run: npm run lint

      # 6. Vitest — runs the full test suite
      - name: Run tests
        run: npm run test
        env:
          # Provide empty stubs so env-dependent code doesn't crash in CI
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
          GEMINI_API_KEY: "placeholder-gemini-key"

      # 7. Next.js Production Build
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
          GEMINI_API_KEY: "placeholder-gemini-key"
