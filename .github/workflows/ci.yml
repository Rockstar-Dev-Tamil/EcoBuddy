name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-style: 'npm'
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check Formatting
        run: npx prettier --check "src/**/*.{ts,tsx}"

      - name: Run Linter
        run: npm run lint

      - name: Verify Type Checking
        run: npx tsc --noEmit

      - name: Execute Vitest Suites
        run: npm run test

      - name: Compile Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://mock.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-anon-key
          GEMINI_API_KEY: mock-gemini-key
          # Disable lint/type checking during build step in CI if we ran them separately
          NEXT_TELEMETRY_DISABLED: 1
